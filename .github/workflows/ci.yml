name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Unit tests
        run: swift test
      - name: Release script tests
        run: scripts/test-release.sh
      - name: Bundle
        run: scripts/bundle.sh release
      - name: Check the signature
        run: codesign --verify --deep --strict build/Mestre.app
      - name: Signing keeps one identity across builds
        run: scripts/test-signing.sh
