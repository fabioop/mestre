name: Release

# Pushing a tag like v1.2.3 or v1.2.3-beta.1 releases that commit. See docs/releasing.md.
on:
  push:
    tags: ["v[0-9]*"]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-26
    env:
      TAG: ${{ github.ref_name }}
      HAS_APPLE_SECRETS: ${{ secrets.APPLE_CERTIFICATE_BASE64 != '' }}
      HAS_SPARKLE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY != '' }}
      HAS_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check the tag and the update keys
        env:
          SPARKLE_PUBLIC_KEY: ${{ vars.SPARKLE_PUBLIC_KEY }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || { echo "::error::$TAG is not a version tag"; exit 1; }
          git merge-base --is-ancestor "$GITHUB_SHA" origin/master || { echo "::error::$TAG is not on master"; exit 1; }
          # With only one key, a build ships that can never update, or the appcast never gets it.
          if [ "$HAS_SPARKLE_KEY" = true ] && [ -z "$SPARKLE_PUBLIC_KEY" ]; then echo "::error::SPARKLE_PUBLIC_KEY is missing"; exit 1; fi
          if [ "$HAS_SPARKLE_KEY" != true ] && [ -n "$SPARKLE_PUBLIC_KEY" ]; then echo "::error::SPARKLE_PRIVATE_KEY is missing"; exit 1; fi
          echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"
          echo "BUILD=$(git rev-list --count HEAD)" >> "$GITHUB_ENV"

      - name: Test
        run: |
          swift test
          scripts/test-release.sh

      - name: Import the signing certificate
        if: env.HAS_APPLE_SECRETS == 'true'
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(uuidgen)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          echo "$APPLE_CERTIFICATE_BASE64" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain"
          security list-keychains -d user -s "$keychain" login.keychain

      - name: Build
        env:
          MESTRE_VERSION: ${{ env.VERSION }}
          MESTRE_BUILD: ${{ env.BUILD }}
          MESTRE_SPARKLE_PUBLIC_KEY: ${{ vars.SPARKLE_PUBLIC_KEY }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          if [ "$HAS_APPLE_SECRETS" = true ]; then export MESTRE_SIGN_IDENTITY="$APPLE_SIGNING_IDENTITY"; fi
          scripts/bundle.sh release
          codesign --verify --deep --strict build/Mestre.app

      - name: Notarize
        if: env.HAS_APPLE_SECRETS == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          ditto -c -k --keepParent build/Mestre.app "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" --wait \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD"
          xcrun stapler staple build/Mestre.app

      - name: Package
        run: |
          ditto -c -k --keepParent build/Mestre.app "Mestre-$VERSION.zip"
          scripts/release-notes.sh "$TAG" > notes.md
          if [ "$HAS_APPLE_SECRETS" != true ]; then
            printf 'This build is not notarized. macOS asks you to allow it under System Settings > Privacy & Security.\n\n' | cat - notes.md > notes.tmp
            mv notes.tmp notes.md
          fi

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A re-run after a later step failed finds the release already there.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "Mestre-$VERSION.zip" --clobber
            gh release edit "$TAG" --notes-file notes.md
          else
            flags=()
            case "$VERSION" in *-*) flags=(--prerelease --latest=false) ;; esac
            gh release create "$TAG" "Mestre-$VERSION.zip" --title "Mestre $VERSION" --notes-file notes.md --verify-tag "${flags[@]}"
          fi

      - name: Update the appcast
        if: env.HAS_SPARKLE_KEY == 'true'
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          zip="Mestre-$VERSION.zip"
          signature="$(printf '%s' "$SPARKLE_PRIVATE_KEY" | .build/artifacts/sparkle/Sparkle/bin/sign_update --ed-key-file - -p "$zip")"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git fetch origin appcast; then
            git worktree add "$RUNNER_TEMP/appcast" FETCH_HEAD
          else
            git worktree add --detach "$RUNNER_TEMP/appcast"
            git -C "$RUNNER_TEMP/appcast" switch --orphan appcast
          fi
          python3 scripts/appcast.py --file "$RUNNER_TEMP/appcast/appcast.xml" \
            --version "$VERSION" --build "$BUILD" \
            --url "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$zip" \
            --length "$(stat -f%z "$zip")" --signature "$signature" \
            --min-os "$(/usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' Resources/Info.plist)" \
            --notes-file notes.md
          git -C "$RUNNER_TEMP/appcast" add appcast.xml
          if ! git -C "$RUNNER_TEMP/appcast" diff --cached --quiet; then
            git -C "$RUNNER_TEMP/appcast" commit -m "chore(appcast): add $VERSION"
            git -C "$RUNNER_TEMP/appcast" push origin HEAD:refs/heads/appcast
          fi

      - name: Update the Homebrew cask
        if: env.HAS_TAP_TOKEN == 'true' && !contains(github.ref_name, '-')
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          tap="$RUNNER_TEMP/tap"
          git clone "https://x-access-token:$HOMEBREW_TAP_TOKEN@github.com/${GITHUB_REPOSITORY_OWNER}/homebrew-tap.git" "$tap"
          mkdir -p "$tap/Casks"
          sha="$(shasum -a 256 "Mestre-$VERSION.zip" | cut -d' ' -f1)"
          sed -e "s/@VERSION@/$VERSION/g" -e "s/@SHA256@/$sha/g" packaging/mestre.rb.in > "$tap/Casks/mestre.rb"
          git -C "$tap" config user.name "github-actions[bot]"
          git -C "$tap" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$tap" add Casks/mestre.rb
          if ! git -C "$tap" diff --cached --quiet; then
            git -C "$tap" commit -m "mestre $VERSION"
            git -C "$tap" push origin HEAD
          fi
