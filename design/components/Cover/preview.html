<!-- @dsCard height=288 -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mestre</title>
<style>
  html, body { margin:0; height:100%; }
  body { background:var(--panel-raised); color:var(--ink); font-family:var(--font-sans); overflow:hidden; }
  .cover { position:relative; width:960px; height:288px; overflow:hidden; }
  .art { position:absolute; top:0; left:480px; width:480px; height:288px; overflow:hidden; }
  .art svg { display:block; width:480px; height:288px; }
  .violet { fill:var(--mark-violet); }
  .indigo { fill:var(--mark-indigo); }
  .deep { fill:var(--ink); }
  .spark { fill:var(--mark-spark); }
  .blk { rx:var(--radius-panel); }
  .cap { fill:var(--panel-raised); rx:var(--radius-tile); }
  .pill { rx:var(--radius-row); }
  .words { position:absolute; left:var(--space-5); bottom:var(--space-5); max-width:440px; }
  .name { margin:0; font-size:120px; line-height:.9; font-weight:700; letter-spacing:-.03em; color:var(--ink); }
  .tag { margin:var(--space-2\.5) 0 0 6px; font-size:14px; line-height:20px; color:var(--ink-secondary); }
</style>
</head>
<body>
<div class="cover">
<div class="art" aria-hidden="true">
<svg viewBox="0 0 480 288" width="480" height="288">
<!--
  blocks      mark-violet 224×240 bled off the top (the icon's hue and the accent, largest) · mark-indigo 160×168 (the icon's deep hue) · ink 192×232 bleeding off the right edge (the panel's text ink; near-white in dark so it reads there) · mark-spark 48×24 once (the icon's '+' accent, small) — ≈38 % of 960×288
  arrangement a staggered stack: the indigo block overlaps the violet slab's right edge so it reads against violet in both themes; bottoms on one line space-5 + space-1 above the edge; space-2.5 gutters
  pattern     key caps, from "Keys are glyphs… inside a KeyHint cap" and "Hints live in the footer": 28 pt caps cut into the ink and indigo blocks in the ground colour at an 8 pt gap, with two merged two-wide like the Return and Space caps on a keyboard — a keyboard is the product
  scales      cap = size icon (28), gap = space-2.5 (8), pitch 36; corners radius-panel (12) on blocks, radius-tile (7) on caps, radius-row on the spark pill
-->
<rect class="violet blk" x="0" y="-16" width="224" height="240" rx="12"/>
<rect class="spark pill" x="0" y="240" width="48" height="24" rx="8"/>
<rect class="deep blk" x="304" y="32" width="192" height="232" rx="12"/>
<rect class="indigo blk" x="112" y="96" width="160" height="168" rx="12"/>
<!-- caps in the indigo block: 3 cols × 3 rows, one merged -->
<rect class="cap" x="128" y="112" width="28" height="28" rx="7"/>
<rect class="cap" x="164" y="112" width="28" height="28" rx="7"/>
<rect class="cap" x="200" y="112" width="28" height="28" rx="7"/>
<rect class="cap" x="128" y="148" width="28" height="28" rx="7"/>
<rect class="cap" x="164" y="148" width="28" height="28" rx="7"/>
<rect class="cap" x="200" y="148" width="28" height="28" rx="7"/>
<rect class="cap" x="128" y="184" width="64" height="28" rx="7"/>
<rect class="cap" x="200" y="184" width="28" height="28" rx="7"/>
<!-- caps in the ink block: 5 cols × 6 rows, two merged -->
<rect class="cap" x="320" y="48" width="28" height="28" rx="7"/>
<rect class="cap" x="356" y="48" width="28" height="28" rx="7"/>
<rect class="cap" x="392" y="48" width="28" height="28" rx="7"/>
<rect class="cap" x="428" y="48" width="28" height="28" rx="7"/>
<rect class="cap" x="464" y="48" width="28" height="28" rx="7"/>
<rect class="cap" x="320" y="84" width="28" height="28" rx="7"/>
<rect class="cap" x="356" y="84" width="28" height="28" rx="7"/>
<rect class="cap" x="392" y="84" width="28" height="28" rx="7"/>
<rect class="cap" x="428" y="84" width="28" height="28" rx="7"/>
<rect class="cap" x="464" y="84" width="28" height="28" rx="7"/>
<rect class="cap" x="320" y="120" width="28" height="28" rx="7"/>
<rect class="cap" x="356" y="120" width="28" height="28" rx="7"/>
<rect class="cap" x="392" y="120" width="28" height="28" rx="7"/>
<rect class="cap" x="428" y="120" width="28" height="28" rx="7"/>
<rect class="cap" x="464" y="120" width="28" height="28" rx="7"/>
<rect class="cap" x="392" y="156" width="64" height="28" rx="7"/>
<rect class="cap" x="320" y="156" width="28" height="28" rx="7"/>
<rect class="cap" x="356" y="156" width="28" height="28" rx="7"/>
<rect class="cap" x="464" y="156" width="28" height="28" rx="7"/>
<rect class="cap" x="320" y="192" width="28" height="28" rx="7"/>
<rect class="cap" x="356" y="192" width="28" height="28" rx="7"/>
<rect class="cap" x="392" y="192" width="28" height="28" rx="7"/>
<rect class="cap" x="428" y="192" width="28" height="28" rx="7"/>
<rect class="cap" x="464" y="192" width="28" height="28" rx="7"/>
<rect class="cap" x="356" y="228" width="100" height="28" rx="7"/>
<rect class="cap" x="320" y="228" width="28" height="28" rx="7"/>
<rect class="cap" x="464" y="228" width="28" height="28" rx="7"/>
</svg>
</div>
<div class="words">
  <h1 class="name">Mestre</h1>
  <p class="tag">A launcher that lives in your menu bar.</p>
</div>
</div>
</body>
</html>
